<!doctype html>
<html lang="en">
<head>
    <!-- 1. Page metadata -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- 2. Page title -->
    <title>DBMS Project 3</title>

    <!-- 3. Bootstrap stylesheet -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 4. Custom stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>
    <!-- 5. Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- 5.1 Application title / dashboard link -->
            <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">
                Academic Progress DB
            </a>

            <!-- 5.2 Main navigation buttons -->
            <div>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.students') }}">Students</a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.courses') }}">Courses</a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.new_enrollment') }}">Enroll</a>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main.new_submission') }}">Submission</a>
            </div>
        </div>
    </nav>

    <!-- 6. Main page content -->
    <main class="container py-4">
        <!-- 6.1 Flash messages -->
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}

        <!-- 6.2 Child template content -->
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
