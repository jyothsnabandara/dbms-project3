{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit' if student else 'Add' }} Student</h1><form method="post" class="card card-body"><label>Full Name</label><input class="form-control" name="full_name" value="{{ student.full_name if student else '' }}" required><label>Email</label><input class="form-control" name="email" value="{{ student.email if student else '' }}" required><label>Program</label><input class="form-control" name="program_name" value="{{ student.program.program_name if student else '' }}" required><label>Status</label><select class="form-select" name="student_status"><option>Active</option><option>Inactive</option><option>Graduated</option><option>On Leave</option></select><button class="btn btn-primary mt-3">Save</button></form>{% endblock %}
