{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Students</h1><a class="btn btn-primary" href="{{ url_for('main.new_student') }}">Add Student</a></div><table class="table table-hover"><tr><th>Name</th><th>Email</th><th>Program</th><th>Status</th><th>Action</th></tr>{% for s in students %}<tr><td>{{ s.full_name }}</td><td>{{ s.email }}</td><td>{{ s.program.program_name }}</td><td>{{ s.student_status }}</td><td><a class="btn btn-sm btn-secondary" href="{{ url_for('main.edit_student', student_id=s.student_id) }}">Edit</a><form class="d-inline" method="post" action="{{ url_for('main.delete_student', student_id=s.student_id) }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
