{% extends 'base.html' %}{% block content %}<h1>Create Submission</h1><form method="post" class="card card-body"><label>Student</label><select class="form-select" name="student_id">{% for s in students %}<option value="{{ s.student_id }}">{{ s.full_name }}</option>{% endfor %}</select><label>Assignment</label><select class="form-select" name="assignment_id">{% for a in assignments %}<option value="{{ a.assignment_id }}">{{ a.course.course_name }} - {{ a.title }} / {{ a.max_score }}</option>{% endfor %}</select><label>Score</label><input class="form-control" type="number" min="0" step="0.01" name="score" required><label>Grader Note</label><input class="form-control" name="grader_note"><button class="btn btn-primary mt-3">Save Transaction</button></form>{% endblock %}
