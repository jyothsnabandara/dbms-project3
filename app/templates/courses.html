{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Courses</h1><a class="btn btn-primary" href="{{ url_for('main.new_course') }}">Add Course</a></div><table class="table"><tr><th>Course</th><th>Instructor</th><th>Dates</th><th></th></tr>{% for c in courses %}<tr><td><a href="{{ url_for('main.course_detail', course_id=c.course_id) }}">{{ c.course_name }}</a></td><td>{{ c.instructor.instructor_name }}</td><td>{{ c.start_date }} to {{ c.end_date }}</td><td><form method="post" action="{{ url_for('main.delete_course', course_id=c.course_id) }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
