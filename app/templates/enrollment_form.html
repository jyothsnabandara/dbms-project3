{% extends 'base.html' %}{% block content %}<h1>Create Enrollment</h1><form method="post" class="card card-body"><label>Student</label><select class="form-select" name="student_id">{% for s in students %}<option value="{{ s.student_id }}">{{ s.full_name }}</option>{% endfor %}</select><label>Course</label><select class="form-select" name="course_id">{% for c in courses %}<option value="{{ c.course_id }}">{{ c.course_name }}</option>{% endfor %}</select><label>Enrollment Date</label><input class="form-control" type="date" name="enrollment_date" required><label>Progress %</label><input class="form-control" type="number" min="0" max="100" step="0.01" name="progress_percent" value="0"><label>Record Source</label><input class="form-control" name="record_source" value="Registrar" required><button class="btn btn-primary mt-3">Save</button></form>{% endblock %}
