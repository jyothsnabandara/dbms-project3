{% extends 'base.html' %}

{% block content %}

    <!-- 1. Page Title -->
    <h1>Create Enrollment</h1>

    <!-- 2. Enrollment Form -->
    <form method="post" class="card card-body">

        <!-- 2.1 Student Selection -->
        <label>Student</label>
        <select class="form-select" name="student_id">
            {% for s in students %}
            <option value="{{ s.student_id }}">
                {{ s.full_name }}
            </option>
            {% endfor %}
        </select>

        <!-- 2.2 Course Selection -->
        <label>Course</label>
        <select class="form-select" name="course_id">
            {% for c in courses %}
            <option value="{{ c.course_id }}">
                {{ c.course_name }}
            </option>
            {% endfor %}
        </select>

        <!-- 2.3 Enrollment Date -->
        <label>Enrollment Date</label>
        <input class="form-control" type="date" name="enrollment_date" required>

        <!-- 2.4 Progress Percentage -->
        <label>Progress %</label>
        <input class="form-control" type="number" min="0" max="100" step="0.01" name="progress_percent" value="0">

        <!-- 2.5 Record Source -->
        <label>Record Source</label>
        <input class="form-control" name="record_source" value="Registrar" required>

        <!-- 2.6 Submit Button -->
        <button class="btn btn-primary mt-3">Save</button>

    </form>

{% endblock %}
